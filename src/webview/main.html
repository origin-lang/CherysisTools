<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
        background-color: var(--vscode-editor-background);
        padding: 16px;
        margin: 0;
      }
      .nav-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--vscode-panel-border);
        padding-bottom: 12px;
      }
      .nav-btn {
        padding: 6px 14px;
        border: 1px solid var(--vscode-button-background);
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-foreground);
        border-radius: 4px;
        cursor: pointer;
      }
      .nav-btn.active {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      .tool-view {
        display: none;
      }
      .tool-view.show {
        display: block;
      }
      .form-item {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border);
        border-radius: 4px;
      }
      button {
        padding: 6px 12px;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #logArea {
        margin-top: 16px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
        min-height: 180px;
        padding: 8px;
        border: 1px solid var(--vscode-panel-border);
        overflow: auto;
      }
      #fragmentContainer {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar" id="navBar"></div>
    <div id="view-home" class="tool-view show">
      <h3>Cherysis-tools 工具集</h3>
      <p>上方导航栏选择要运行的工具</p>
    </div>
    <div id="fragmentContainer"></div>
    <div id="logArea"></div>
    <script>
      const vscode = acquireVsCodeApi();
      let currentActiveToolName = "";
      let pendingMessages = [];
      function renderNav(list) {
        const navDom = document.getElementById("navBar");
        navDom.innerHTML = "";
        list.forEach((item) => {
          const btn = document.createElement("button");
          btn.className = "nav-btn";
          btn.innerText = item.title;
          btn.dataset.tool = item.toolName;
          btn.onclick = () => {
            currentActiveToolName = item.toolName;
            document
              .querySelectorAll(".nav-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            if (item.toolName === "home") {
              document.getElementById("fragmentContainer").innerHTML = "";
              document
                .querySelectorAll(".tool-view")
                .forEach((v) => v.classList.remove("show"));
              document.getElementById("view-home").classList.add("show");
            } else {
              vscode.postMessage({
                type: "switchTool",
                toolName: item.toolName,
              });
              document
                .querySelectorAll(".tool-view")
                .forEach((v) => v.classList.remove("show"));
            }
          };
          navDom.appendChild(btn);
        });
      }
      function bindFragmentEvents() {
        document.querySelectorAll(".sub-tab").forEach((tab) => {
          tab.onclick = () => {
            const sub = tab.dataset.sub;
            document
              .querySelectorAll(".sub-tab")
              .forEach((t) => t.classList.remove("active"));
            document
              .querySelectorAll(".sub-panel")
              .forEach((p) => p.classList.remove("show"));
            tab.classList.add("active");
            document.getElementById(sub).classList.add("show");
          };
        });
        document
          .querySelectorAll('[data-action="selectFolder"]')
          .forEach((btn) => {
            btn.onclick = () => {
              const tid = btn.dataset.targetId;
              vscode.postMessage({ type: "selectFolder", targetId: tid });
            };
          });
        document
          .querySelectorAll('[data-action="openTargetFolder"]')
          .forEach((btn) => {
            btn.onclick = () => {
              const tid = btn.dataset.targetId;
              const input = document.getElementById(tid);
              const pathVal = input ? input.value.trim() : "";
              if (!pathVal) {
                vscode.postMessage({
                  type: "log",
                  text: "⚠️请先选择目标文件夹",
                });
                return;
              }
              vscode.postMessage({
                type: "openTargetFolder",
                targetPath: pathVal,
              });
            };
          });
        document.querySelectorAll('[data-action="runTool"]').forEach((btn) => {
          btn.onclick = () => {
            const tn = btn.dataset.toolName;
            const subMode = btn.dataset.subMode;
            const params = { subMode };
            const logDom = document.getElementById("logArea");
            if (logDom) {
              logDom.innerText = "";
            }
            const activePanel = document.querySelector(".sub-panel.show");
            if (activePanel) {
              activePanel.querySelectorAll("input").forEach((inp) => {
                if (inp.type === "radio") {
                  if (inp.checked) {
                    params[inp.name] = inp.value;
                  }
                } else if (inp.type === "checkbox") {
                  params[inp.id] = inp.checked;
                } else if (inp.id) {
                  params[inp.id] =
                    inp.type === "number" ? Number(inp.value) : inp.value;
                }
              });
            }
            vscode.postMessage({
              type: "runTool",
              toolName: tn,
              params: params,
            });
          };
        });
      }
      function initNineGridFragment() {
        window.nineGridState = {
          gridItems: new Array(9).fill(null),
          uriMap: {},
          dragSrcIdx: null,
          contextIdx: -1,
          outDir: "",
          labelSrcPath: "",
          labelStartNum: 1,
          labelOutDir: "",
        };
        const s = window.nineGridState;
        const nineGridActionMap = {
          openSelectImages: () => {
            vscode.postMessage({ type: "openSelectImages" });
          },
          openLoadImageFolder: () => {
            vscode.postMessage({ type: "openLoadImageFolder" });
          },
          btnClear: () => {
            s.gridItems.fill(null);
            s.uriMap = {};
            s.dragSrcIdx = null;
            nineGridRenderAll();
          },
          selectOutputFolder: () => {
            vscode.postMessage({ type: "selectOutputFolder" });
          },
          openMergeOutputFolder: () => {
            vscode.postMessage({
              type: "openMergeOutputFolder",
              outDir: s.outDir,
            });
          },
          runMerge: () => {
            vscode.postMessage({
              type: "runMerge",
              grid: s.gridItems,
              outDir: s.outDir,
            });
          },
          selectLabelImage: () => {
            vscode.postMessage({ type: "selectLabelImage" });
          },
          selectLabelOutDir: () => {
            vscode.postMessage({ type: "selectLabelOutDir" });
          },
          openLabelOutputFolder: () => {
            vscode.postMessage({
              type: "openLabelOutputFolder",
              targetDir: s.labelOutDir,
            });
          },
          runLabel: () => {
            const numEl = document.getElementById("labelStartNum");
            s.labelStartNum = parseInt(numEl?.value || "1", 10);
            vscode.postMessage({
              type: "runLabel",
              srcPath: s.labelSrcPath,
              startNum: s.labelStartNum,
              outDir: s.labelOutDir,
            });
          },
          rotate: () => {
            vscode.postMessage({
              type: "rotateImage",
              idx: s.contextIdx,
              grid: s.gridItems,
            });
          },
          delete: () => {
            s.gridItems[s.contextIdx] = null;
            nineGridRenderCell(s.contextIdx);
            nineGridUpdateStatus();
          },
        };
        const fragmentRoot = document.getElementById("fragmentContainer");
        fragmentRoot.querySelectorAll("[data-action]").forEach((btn) => {
          const act = btn.dataset.action;
          btn.onclick = () => {
            if (nineGridActionMap[act]) {
              nineGridActionMap[act]();
            }
          };
        });
        const gridContainer = document.getElementById("gridContainer");
        gridContainer.innerHTML = "";
        for (let i = 0; i < 9; i++) {
          const cell = document.createElement("div");
          cell.className = "grid-cell normal";
          cell.dataset.idx = i;
          cell.innerHTML = `<div class="grid-img-wrap"><span>空位${i + 1}</span></div><div class="grid-text"></div>`;
          cell.addEventListener("click", (e) => handleCellClick(i, e));
          cell.addEventListener("contextmenu", (e) => handleRightClick(i, e));
          gridContainer.appendChild(cell);
        }
        const ctxMenu = document.getElementById("ctxMenu");
        document.body.onclick = () => {
          if (ctxMenu) {
            ctxMenu.style.display = "none";
          }
        };
        nineGridRenderAll();
        //回放缓存消息
        while (pendingMessages.length > 0) {
          const m = pendingMessages.shift();
          handleMessageInternal(m);
        }
        function handleCellClick(idx, ev) {
          ev.stopPropagation();
          if (s.dragSrcIdx === null) {
            s.dragSrcIdx = idx;
          } else {
            const src = s.dragSrcIdx;
            if (src !== idx) {
              [s.gridItems[src], s.gridItems[idx]] = [
                s.gridItems[idx],
                s.gridItems[src],
              ];
            }
            s.dragSrcIdx = null;
          }
          nineGridRenderAll();
        }
        function handleRightClick(idx, ev) {
          ev.preventDefault();
          if (s.gridItems[idx] === null) {
            return;
          }
          s.contextIdx = idx;
          if (!ctxMenu) {
            return;
          }
          ctxMenu.style.left = ev.pageX + "px";
          ctxMenu.style.top = ev.pageY + "px";
          ctxMenu.style.display = "block";
        }
        function nineGridUpdateStatus() {
          const count = s.gridItems.filter((x) => x !== null).length;
          const el = document.getElementById("statusText");
          if (el) {
            el.textContent = `已填充：${count} / 9`;
          }
        }
        function nineGridRenderCell(idx) {
          const cellDom = gridContainer.children[idx];
          const path = s.gridItems[idx];
          cellDom.className = "grid-cell normal";
          if (s.dragSrcIdx === idx) {
            cellDom.className = "grid-cell selected";
          }
          const imgWrap = cellDom.querySelector(".grid-img-wrap");
          const textDom = cellDom.querySelector(".grid-text");
          if (path === null) {
            imgWrap.innerHTML = `<span>空位${idx + 1}</span>`;
            textDom.textContent = "";
            return;
          }
          // 修复Windows路径取文件名
          textDom.textContent = path.split("\\").pop().split("/").pop();
          const imgSrc = s.uriMap[path];
          if (imgSrc) {
            imgWrap.innerHTML = `<img src="${imgSrc}" style="max-width:100%;max-height:100%;object-fit:contain;" />`;
          } else {
            imgWrap.innerHTML = `<span>图片加载失败</span>`;
          }
        }
        function nineGridRenderAll() {
          for (let i = 0; i < 9; i++) {
            nineGridRenderCell(i);
          }
          nineGridUpdateStatus();
        }
        window.nineGridRenderCell = nineGridRenderCell;
        window.nineGridRenderAll = nineGridRenderAll;
        window.nineGridUpdateStatus = nineGridUpdateStatus;
      }
      function handleMessageInternal(msg) {
        const s = window.nineGridState;
        if (msg.type === "addImagePaths") {
          if (!s) return;
          s.uriMap = msg.uriMap;
          for (const p of msg.paths) {
            const emptyIdx = s.gridItems.findIndex((x) => x === null);
            if (emptyIdx === -1) break;
            s.gridItems[emptyIdx] = p;
          }
          window.nineGridRenderAll();
        } else if (msg.type === "setOutputDir") {
          if (!s) return;
          s.outDir = msg.path;
          const el = document.getElementById("outDirInput");
          if (el) el.value = msg.path;
        } else if (msg.type === "setLabelOutDir") {
          if (!s) return;
          s.labelOutDir = msg.path;
          const el = document.getElementById("labelOutDirInput");
          if (el) el.value = msg.path;
        } else if (msg.type === "setLabelImage") {
          if (!s) return;
          s.labelSrcPath = msg.path;
          const previewBox = document.getElementById("labelPreviewBox");
          if (previewBox && msg.base64) {
            previewBox.innerHTML = `<img src="${msg.base64}" style="max-width:100%;max-height:100%;object-fit:contain;" />`;
          }
          const inputEl = document.getElementById("labelSrcInput");
          if (inputEl) inputEl.value = msg.path;
        } else if (msg.type === "reRenderCell") {
          if (window.nineGridRenderCell) window.nineGridRenderCell(msg.idx);
        } else if (msg.type === "folderSelected") {
          const el = document.getElementById(msg.targetId);
          if (el) el.value = msg.path;
        } else if (msg.type === "log") {
          const logDom = document.getElementById("logArea");
          logDom.innerText += msg.text + "\n";
          logDom.scrollTop = logDom.scrollHeight;
        } else if (msg.type === "rotatedCellUpdate") {
          if (!s) return;
          //覆盖旧缓存，写入旋转后的图片base64
          s.uriMap[msg.filePath] = msg.newBase64;
          nineGridRenderCell(msg.idx);
        } else if (msg.type === "clearLog") {
          const logDom = document.getElementById("logArea");
          if (logDom) logDom.innerText = "";
        }
      }
      window.addEventListener("message", (ev) => {
        const msg = ev.data;
        if (msg.type === "initToolList") {
          renderNav(msg.toolList);
        } else if (msg.type === "switchFragment") {
          document.getElementById("fragmentContainer").innerHTML = msg.html;
          //【修复：调换顺序，先初始化九宫格，再绑定普通事件】
          if (document.getElementById("gridContainer")) {
            window.nineGridState = null;
            initNineGridFragment();
          }
          bindFragmentEvents();
        } else {
          if (
            [
              "addImagePaths",
              "rotatedCellUpdate",
              "clearLog",
              "setOutputDir",
              "setLabelOutDir",
              "setLabelImage",
              "reRenderCell",
              "folderSelected",
              "log",
            ].includes(msg.type)
          ) {
            if (!window.nineGridState) {
              pendingMessages.push(msg);
              return;
            }
            handleMessageInternal(msg);
          }
        }
      });
      window.onload = () => {
        vscode.postMessage({ type: "init" });
      };
    </script>
  </body>
</html>
