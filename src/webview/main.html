<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
        background-color: var(--vscode-editor-background);
        padding: 16px;
        margin: 0;
        box-sizing: border-box;
      }
      .top-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--vscode-panel-border);
        padding-bottom: 12px;
      }
      .toggle-btn {
        padding: 6px 14px;
        border: 1px solid var(--vscode-button-background);
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-foreground);
        border-radius: 4px;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      #mainRow {
        display: flex;
        align-items: stretch;
        gap: 12px;
      }
      #contentArea {
        flex: 1;
        min-width: 0;
      }
      .tool-view {
        display: none;
      }
      .tool-view.show {
        display: block;
      }
      #fragmentContainer {
        margin-bottom: 16px;
      }
      #logPanel {
        width: 340px;
        max-width: 45%;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-height: 200px;
      }
      #logPanel.collapsed {
        display: none;
      }
      .log-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border: 1px solid var(--vscode-panel-border);
        border-bottom: none;
        background: var(--vscode-sideBar-background);
      }
      .log-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--vscode-descriptionForeground);
      }
      .log-header .spacer {
        flex: 1;
      }
      .log-clear {
        padding: 2px 12px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid var(--vscode-button-border, transparent);
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
        border-radius: 3px;
      }
      .log-clear:hover {
        background: var(--vscode-button-secondaryHoverBackground, var(--vscode-button-secondaryBackground));
      }
      #logArea {
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
        flex: 1;
        min-height: 200px;
        padding: 8px;
        border: 1px solid var(--vscode-panel-border);
        overflow-y: auto;
        background: var(--vscode-editor-background);
      }
      #shToast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 5000;
        max-width: 80%;
        padding: 6px 16px;
        background: var(--vscode-editor-background);
        border: 1px solid var(--vscode-focusBorder, var(--vscode-panel-border));
        border-radius: 20px;
        color: var(--vscode-foreground);
        font-size: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
        white-space: pre-wrap;
      }
      #shToast.show {
        opacity: 1;
      }
      #shToastActions {
        display: inline-flex;
        gap: 6px;
        margin-left: 10px;
        pointer-events: auto;
        vertical-align: middle;
      }
      #shToastActions button {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        border-radius: 12px;
        padding: 2px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #shToastActions button:hover {
        filter: brightness(1.1);
      }
    </style>
  </head>
  <body>
    <div class="top-row">
      <button class="toggle-btn" id="logPanelToggle" title="显示/隐藏右侧运行日志">📋 运行日志</button>
    </div>
    <div id="mainRow">
      <div id="contentArea">
        <div id="view-home" class="tool-view show">
          <h3>Cherysis-tools 工具集</h3>
          <p>在左侧活动栏选择要运行的工具</p>
        </div>
        <div id="fragmentContainer"></div>
      </div>
      <div id="logPanel" class="collapsed">
        <div class="log-header">
          <span class="log-title">运行日志</span>
          <span class="spacer"></span>
          <button class="log-clear" id="clearLogBtn" title="清空日志">清空</button>
        </div>
        <div id="logArea"></div>
      </div>
    </div>
    <script>
      const vscode = acquireVsCodeApi();
      window.__vscode = vscode;
      let currentToolName = "";
      let currentToolClient = null;
      // 在工具客户端尚未初始化时，先暂存需要投递的消息
      let pendingClientMessages = [];
      // 小工具（utility）切走时保留其 DOM，切回时原样恢复，避免输入内容被清空
      const utilityTools = new Set();
      const toolHolders = {};

      const logPanelEl = document.getElementById("logPanel");
      const logPanelToggle = document.getElementById("logPanelToggle");
      let shToastTimer = null;
      function showGlobalToast(text, actions) {
        let el = document.getElementById("shToast");
        if (!el) {
          el = document.createElement("div");
          el.id = "shToast";
          document.body.appendChild(el);
        }
        el.textContent = text;
        const oldWrap = document.getElementById("shToastActions");
        if (oldWrap) {
          oldWrap.remove();
        }
        if (actions && actions.length) {
          const wrap = document.createElement("span");
          wrap.id = "shToastActions";
          for (const a of actions) {
            const b = document.createElement("button");
            b.textContent = a.label;
            b.onclick = a.handler;
            wrap.appendChild(b);
          }
          el.appendChild(wrap);
        }
        el.classList.add("show");
        clearTimeout(shToastTimer);
        shToastTimer = setTimeout(
          () => el.classList.remove("show"),
          actions && actions.length ? 6000 : 2000,
        );
      }
      window.showGlobalToast = showGlobalToast;
      function setLogCollapsed(collapsed) {
        logPanelEl.classList.toggle("collapsed", collapsed);
        logPanelToggle.classList.toggle("active", !collapsed);
        if (!collapsed) {
          const logDom = document.getElementById("logArea");
          if (logDom) {logDom.scrollTop = logDom.scrollHeight;}
        }
      }
      logPanelToggle.onclick = () => {
        setLogCollapsed(!logPanelEl.classList.contains("collapsed"));
      };
      setLogCollapsed(true);

      function getHolder(toolName) {
        if (!toolHolders[toolName]) {
          const holder = document.createElement("div");
          holder.style.display = "none";
          document.body.appendChild(holder);
          toolHolders[toolName] = holder;
        }
        return toolHolders[toolName];
      }

      /** 显示某个小工具的 fragment。首次渲染走正常流程；再次切回则从 holder 恢复原 DOM，不重新 init */
      function showUtilityFragment(msg) {
        const container = document.getElementById("fragmentContainer");
        const holder = getHolder(msg.toolName);
        if (holder.children.length > 0) {
          container.replaceChildren(...holder.children);
          currentToolClient =
            (window.toolClients && window.toolClients[msg.toolName]) || null;
          return;
        }
        container.innerHTML = msg.html;
        bindFragmentGenericEvents();
        loadToolClient(msg.clientScript);
      }

      /** 切走当前小工具时，把它的 DOM 原样挪进专属 holder 保留 */
      function stashCurrentUtility() {
        if (!currentToolName || currentToolName === "home") return;
        if (!utilityTools.has(currentToolName)) return;
        const container = document.getElementById("fragmentContainer");
        if (container.children.length === 0) return;
        const holder = getHolder(currentToolName);
        holder.replaceChildren(...container.children);
      }

      function switchTool(toolName) {
        stashCurrentUtility();
        currentToolName = toolName;
        document
          .querySelectorAll(".tool-view")
          .forEach((v) => v.classList.remove("show"));
        vscode.postMessage({ type: "switchTool", toolName });
      }

      // 通用事件绑定：适用于用 data-action 声明的表单型工具（如图片批量工具）
      function bindFragmentGenericEvents() {
        document.querySelectorAll(".sub-tab").forEach((tab) => {
          tab.onclick = () => {
            const sub = tab.dataset.sub;
            document
              .querySelectorAll(".sub-tab")
              .forEach((t) => t.classList.remove("active"));
            document
              .querySelectorAll(".sub-panel")
              .forEach((p) => p.classList.remove("show"));
            tab.classList.add("active");
            const target = document.getElementById(sub);
            if (target) target.classList.add("show");
          };
        });
        document.querySelectorAll('[data-action="selectFolder"]').forEach((btn) => {
          btn.onclick = () => {
            const tid = btn.dataset.targetId;
            vscode.postMessage({ type: "selectFolder", targetId: tid, toolName: currentToolName });
          };
        });
        document.querySelectorAll('[data-action="openTargetFolder"]').forEach((btn) => {
          btn.onclick = () => {
            const tid = btn.dataset.targetId;
            const input = document.getElementById(tid);
            const pathVal = input ? input.value.trim() : "";
            if (!pathVal) {
              vscode.postMessage({ type: "log", text: "⚠️请先选择目标文件夹" });
              return;
            }
            vscode.postMessage({ type: "openTargetFolder", targetPath: pathVal, toolName: currentToolName });
          };
        });
        document.querySelectorAll('[data-action="runTool"]').forEach((btn) => {
          btn.onclick = () => {
            const tn = btn.dataset.toolName;
            const subMode = btn.dataset.subMode;
            const params = { subMode };
            const logDom = document.getElementById("logArea");
            if (logDom) logDom.innerText = "";
            const activePanel = document.querySelector(".sub-panel.show");
            if (activePanel) {
              activePanel.querySelectorAll("input").forEach((inp) => {
                if (inp.type === "radio") {
                  if (inp.checked) params[inp.name] = inp.value;
                } else if (inp.type === "checkbox") {
                  params[inp.id] = inp.checked;
                } else if (inp.id) {
                  params[inp.id] = inp.type === "number" ? Number(inp.value) : inp.value;
                }
              });
            }
            vscode.postMessage({ type: "runTool", toolName: tn, params });
          };
        });
      }

      function loadToolClient(clientInfo) {
        // 移除上一个工具的全部客户端脚本
        document.querySelectorAll(".toolClientScript").forEach((s) => s.remove());
        currentToolClient = null;
        const uris = clientInfo && clientInfo.uris && clientInfo.uris.length
          ? clientInfo.uris
          : [];
        const toolName = clientInfo && clientInfo.toolName;
        if (!uris.length || !toolName) return;
        // 按序加载多个脚本，全部加载成功后再装配并 init()
        const loadOne = (i) => {
          if (i >= uris.length) {
            const client =
              (window.toolClients && window.toolClients[toolName]) || null;
            currentToolClient = client;
            if (client && client.init) {
              try {
                client.init();
              } catch (err) {
                vscode.postMessage({
                  type: "log",
                  text: "❌工具初始化失败：" + (err && err.message ? err.message : String(err)),
                });
                return;
              }
            }
            // 投递暂存的消息
            while (pendingClientMessages.length > 0) {
              const m = pendingClientMessages.shift();
              if (currentToolClient && currentToolClient.onMessage) {
                currentToolClient.onMessage(m);
              }
            }
            return;
          }
          const script = document.createElement("script");
          script.className = "toolClientScript";
          script.src = uris[i];
          script.onload = () => loadOne(i + 1);
          script.onerror = () => {
            vscode.postMessage({
              type: "log",
              text: "❌工具客户端脚本加载失败：" + toolName,
            });
          };
          document.body.appendChild(script);
        };
        loadOne(0);
      }

      function handleMessage(msg) {
        if (msg.type === "initToolList") {
          // 顶部导航已移除，工具入口改到活动栏侧边目录树，这里只记录小工具名单
          utilityTools.clear();
          (msg.toolList || []).forEach((t) => {
            if (t.category === "utility") utilityTools.add(t.toolName);
          });
        } else if (msg.type === "autoOpenTool") {
          switchTool(msg.toolName);
        } else if (msg.type === "switchFragment") {
          stashCurrentUtility();
          if (msg.toolName) currentToolName = msg.toolName;
          if (utilityTools.has(msg.toolName)) {
            showUtilityFragment(msg);
          } else {
            document.getElementById("fragmentContainer").innerHTML = msg.html;
            bindFragmentGenericEvents();
            loadToolClient(msg.clientScript);
          }
        } else if (msg.type === "log") {
          const logDom = document.getElementById("logArea");
          if (logDom) {
            const div = document.createElement("div");
            div.className = "log-line";
            div.textContent = msg.text;
            logDom.appendChild(div);
            logDom.scrollTop = logDom.scrollHeight;
          }
        } else if (msg.type === "toast") {
          showGlobalToast(msg.text);
        } else if (msg.type === "clearLog") {
          const logDom = document.getElementById("logArea");
          if (logDom) logDom.innerText = "";
        } else if (msg.type === "folderSelected") {
          const el = document.getElementById(msg.targetId);
          if (el) el.value = msg.path;
        } else {
          // 工具专属消息 → 交给当前工具客户端处理
          if (currentToolClient && currentToolClient.onMessage) {
            currentToolClient.onMessage(msg);
          } else {
            pendingClientMessages.push(msg);
          }
        }
      }

      window.addEventListener("message", (ev) => {
        handleMessage(ev.data);
      });
      document.getElementById("clearLogBtn").onclick = () => {
        const logDom = document.getElementById("logArea");
        if (logDom) logDom.innerText = "";
      };
      window.onload = () => {
        vscode.postMessage({ type: "init" });
      };
    </script>
  </body>
</html>
